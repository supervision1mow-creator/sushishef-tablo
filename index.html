<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E2D26">
<title>Суши-Шеф · Табло</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235F5A2E'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='30' font-weight='700' text-anchor='middle' fill='%23FBFAF5'%3EСШ%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #F3F0E6; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #wait { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    font: 600 16px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #2E2D26; background: #F3F0E6; transition: opacity .3s; }
  #wait.gone { opacity: 0; pointer-events: none; }
  .ring { width: 36px; height: 36px; border-radius: 50%; border: 4px solid #D9D3BE; border-top-color: #5F5A2E; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
</style>
</head>
<body>
<div id="wait" role="status" aria-live="polite"><div class="ring" aria-hidden="true"></div>Загружаю табло…</div>
<iframe id="app" title="Суши-Шеф · Табло" allow="clipboard-write"></iframe>
<script>
  // Адрес веб-приложения Apps Script. Ключ входа из ссылки (?t=…#t=…) передаётся внутрь табло как есть.
  var APP = 'https://script.google.com/macros/s/AKfycbzlhvSDStNaYIQPU9hUDEHSY-1hRQr5uSq37OO6TqK4tLLDgg0JXWSkrI9REOLJs75W/exec';
  var frame = document.getElementById('app'), wait = document.getElementById('wait');
  frame.addEventListener('load', function () { wait.className = 'gone'; });
  setTimeout(function () { wait.className = 'gone'; }, 15000);
  frame.src = APP + location.search + location.hash;
</script>
</body>
</html>
